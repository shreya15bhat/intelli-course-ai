services:
  - type: web
    name: intelli-course-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DEMO_MODE
        value: "false"
      - key: GEMINI_MODEL
        value: "gemini-3.1-flash-lite"
      - key: GEMINI_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.5"
